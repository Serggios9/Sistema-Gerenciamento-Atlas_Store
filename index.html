<!DOCTYPE html>

<body>

    <header>

                <a href="index.html" class="logo">

                        <span class="logo-ponto">.</span>
                        <span class="logo-store">STORE</span>
                    </h1>
                </a>

            </div>

            <div class="menu"> <!--Navegação principal-->

                <ul>

                    <li>
                        <a href="pages/novidades.html">NOVIDADES</a>
                    </li>

                    <li>

                    </li>

                <!-- Botões de ação -->
                <div class="apresentacao-botoes">
                    <a class="btn-colecao" href="pages/colecoes.html">

                </div>
            </div>

            <div class="apresentacao-imagens">
                <img class="img-destaque" src="assets/images/apresentacao/img-whiteshirt-apresentacao.png" alt="Produto em destaque">
                <img class="img-esportiva" src="assets/images/apresentacao/img-varias1-apresnetacao.png" alt="Produto esportivo">

        <section class="menu-central">
            <ul>
